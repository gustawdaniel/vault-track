packages:
  - 'libs/*'
  - 'apps/*'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - 'better-sqlite3'
  - 'esbuild'
  - 'sharp'
  - 'unrs-resolver'
  - 'vue-demi'

# security floors: each one keeps the version line that was asked for (^), so a package that wants minimatch 3
# does not get minimatch 10
overrides:
  'zod': '^4.6.6'
  'zod-to-json-schema': '^3.25.1'
  'minimatch@<3.1.4': '^3.1.4'
  'minimatch@>=5.0.0 <5.1.8': '^5.1.8'
  'minimatch@>=9.0.0 <9.0.7': '^9.0.7'
  'minimatch@>=10.0.0 <10.2.3': '^10.2.3'
  'rollup@>=4.0.0 <4.59.0': '^4.59.0'
  'hono@<4.12.4': '^4.12.4'
  '@hono/node-server@<1.19.10': '^1.19.10'
  'serialize-javascript@<=7.0.2': '^7.0.3'
  'svgo@=4.0.0': '^4.0.1'
  'express-rate-limit@>=8.2.0 <8.2.2': '^8.2.2'
  'tar@<=7.5.9': '^7.5.10'
  '@tiptap/core': '^3.32.0'
  '@tiptap/pm': '^3.32.0'
