name: "Cross-Platform Build & Release"

on:
  push:
    branches:
      - tauri
      - main
    tags:
      - 'v*' # Trigger deployment when a version tag is pushed (e.g., v1.0.0)
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      # Linux-specific dependencies (WebKit & GTK) for Tauri
      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Prebuild Workspace Libraries
        run: pnpm --filter qif-ts --filter qif2json build

      - name: Build Tauri Desktop Apps
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_URL: "https://api.vaulttrack.org/api"
        with:
          projectPath: './apps/ui'
          tagName: ${{ github.ref_name }} # Creates/targets the Github Release
          releaseName: 'VaultTrack Desktop v__VERSION__'
          releaseBody: 'Automated release notes will be generated by GitHub.'
          releaseDraft: true
          prerelease: false

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & Pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Monorepo Dependencies
        run: pnpm install

      - name: Prebuild Workspace Libraries
        run: pnpm --filter qif-ts --filter qif2json build

      - name: Build Android App (APK & AAB)
        working-directory: apps/ui
        env:
          BACKEND_URL: "https://api.vaulttrack.org/api"
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          pnpm tauri android init

          # Create network security config to allow HTTPS to external domains
          cat > src-tauri/gen/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false">
              <trust-anchors>
                <certificates src="system" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          EOF

          # Patch AndroidManifest.xml: add camera permission + network security config
          node -e "
            const fs = require('fs');
            const file = 'src-tauri/gen/android/app/src/main/AndroidManifest.xml';
            let content = fs.readFileSync(file, 'utf8');
            // Add camera permissions before <application>
            content = content.replace('<application', '<uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n    <application');
            // Add networkSecurityConfig to <application> tag
            content = content.replace('<application', '<application android:networkSecurityConfig=\"@xml/network_security_config\"');
            fs.writeFileSync(file, content);
          "

          pnpm tauri android build --apk --debug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
           name: vault-track-android-apk
           path: apps/ui/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
           name: vault-track-android-aab
           path: apps/ui/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
