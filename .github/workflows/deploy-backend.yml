name: Deploy Backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

# Two quick pushes used to run `docker compose up` at the same time on the VPS
# and fail with a container name conflict; deploy one at a time instead.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repo name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}

      - name: Prepare docker-compose.yml
        run: |
          sed -i "s|\${GITHUB_REPOSITORY_LOWER}|${{ env.REPO }}|g" deploy/docker-compose.yml

      - name: Prepare VPS Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: mkdir -p ~/api.vaulttrack.org

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          source: "deploy/docker-compose.yml"
          target: "~/api.vaulttrack.org"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          IMAGE_NAME: ghcr.io/${{ env.REPO }}/backend:latest
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          envs: TURSO_DATABASE_URL,TURSO_AUTH_TOKEN,OPENAI_API_KEY,ADMIN_EMAIL,ADMIN_TOKEN_SECRET,COOKIE_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_API_KEY,GEMINI_MODEL,IMAGE_NAME
          script: |
            cd ~/api.vaulttrack.org
            
            # Login to GHCR (might need PAT if private repo, or use docker login with minimal permissions token passed securely)
            # Assuming public package or manual login setup previously.
            # If private, user needs to add login step here or use existing auth.
            # echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Update .env without wiping unrelated keys (e.g. ADMIN_TOKEN_SECRET).
            touch .env
            update_env() {
              key="$1"
              val="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            update_env OPENAI_API_KEY "$OPENAI_API_KEY"
            update_env ADMIN_EMAIL "$ADMIN_EMAIL"
            update_env ADMIN_TOKEN_SECRET "$ADMIN_TOKEN_SECRET"
            update_env COOKIE_SECRET "$COOKIE_SECRET"
            update_env GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
            update_env GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
            update_env GOOGLE_API_KEY "$GOOGLE_API_KEY"
            update_env GEMINI_MODEL "$GEMINI_MODEL"
            
            # Pull and restart
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Check logs
            # docker-compose logs --tail=20 backend
